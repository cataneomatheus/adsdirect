<!doctype html>
<html lang="en-US">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DashOne Pro | Official Offer</title>
  <meta name="description" content="Discover DashOne Pro, a compact dash camera designed to record your journeys on the road.">
  <meta name="robots" content="noindex, nofollow">
  <link rel="preload" as="image" type="image/webp" href="/assets/img/dash-cam-background.webp">
  <link rel="stylesheet" href="/assets/css/site.css">
  <script>
    window.cnl = {
      map: {
        "sub2": ["gclid"],
        "sub1": ["utm_source"],
        "sub3": ["utm_medium", "utm_campaign", "utm_content", "utm_term"]
      }
    };
  </script>
  <script src="https://cdn.jsdelivr.net/gh/opadim/assets/base.js"></script>
  <style>
    html,
    body {
      width: 100%;
      min-height: 100%;
      overflow: hidden;
    }

    body.dashcam-page {
      --ink: #121923;
      --muted: #56616f;
      --brand: #263342;
      --accent: #185ea8;
      --accent-dark: #10487f;
      min-height: 100vh;
      min-height: 100svh;
      background: #dfe5eb url('/assets/img/dash-cam-background.webp') center center / cover no-repeat;
    }

    .dashcam-page .cookie-modal {
      background: rgba(9, 18, 28, .70);
    }

    .dashcam-page .cookie-modal__accept {
      box-shadow: 0 7px 0 #0c3c6b, 0 12px 25px rgba(24, 94, 168, .25);
    }

    .dashcam-page .cookie-modal__accept:hover {
      border-color: #2876c5;
      background: #2876c5;
    }
  </style>
</head>
<body class="dashcam-page">
  <dialog class="cookie-modal" open aria-labelledby="cookie-modal-title" aria-describedby="cookie-modal-description">
    <div class="cookie-modal__dialog">
      <p class="cookie-modal__eyebrow">Your privacy</p>
      <h2 id="cookie-modal-title">Do you accept cookies?</h2>
      <p id="cookie-modal-description">We use cookies to remember your choice and retain advertising attribution identifiers. You can accept or reject non-essential cookies.</p>
      <form class="cookie-modal__actions" method="dialog">
        <a href="/go/dashcam/" rel="nofollow sponsored" class="cookie-modal__accept">Accept</a>
        <a href="/go/dashcam/" rel="nofollow sponsored" class="cookie-modal__reject">Reject</a>
      </form>
    </div>
  </dialog>
</body>
</html>
