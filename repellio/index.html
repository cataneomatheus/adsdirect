<!doctype html>
<html lang="en-US">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Repellio | A Smarter Way to Keep Pests Away</title>
  <meta name="description" content="Discover Repellio, the easy-to-use electronic pest repeller designed for your home.">
  <meta name="robots" content="noindex, nofollow">
  <link rel="preload" as="image" href="/assets/img/repellio-background.jpg">
  <link rel="stylesheet" href="/assets/css/site.css">
  <script>
    window.cnl = {
      map: {
        "sub2": ["gclid"],
        "sub1": ["utm_source"],
        "sub3": ["utm_medium", "utm_campaign", "utm_content", "utm_term"]
      }
    };
  </script>
  <script src="https://cdn.jsdelivr.net/gh/opadim/assets/base.js"></script>
  <style>
    html,
    body {
      width: 100%;
      min-height: 100%;
      overflow: hidden;
    }

    body.repellio-page {
      --ink: #151126;
      --muted: #5d586b;
      --brand: #302a3f;
      --accent: #5e2bff;
      --accent-dark: #491ccc;
      min-height: 100vh;
      min-height: 100svh;
      background: #d8d8dc url('/assets/img/repellio-background.jpg') center center / cover no-repeat;
    }

    .repellio-page .cookie-modal {
      background: rgba(15, 11, 25, .68);
    }

    .repellio-page .cookie-modal__accept {
      box-shadow: 0 7px 0 #3d16b5, 0 12px 25px rgba(94, 43, 255, .25);
    }

    .repellio-page .cookie-modal__accept:hover {
      border-color: #7248ff;
      background: #7248ff;
    }

    @media (max-width: 560px) {
      body.repellio-page {
        background-position: 66% center;
      }
    }
  </style>
</head>
<body class="repellio-page">
  <dialog class="cookie-modal" open aria-labelledby="cookie-modal-title" aria-describedby="cookie-modal-description">
    <div class="cookie-modal__dialog">
      <p class="cookie-modal__eyebrow">Your privacy</p>
      <h2 id="cookie-modal-title">Do you accept cookies?</h2>
      <p id="cookie-modal-description">We use cookies to remember your choice and retain advertising attribution identifiers. You can accept or reject non-essential cookies.</p>
      <form class="cookie-modal__actions" method="dialog">
        <a href="/go/repellio/" rel="nofollow sponsored" class="cookie-modal__accept">Accept</a>
        <a href="/go/repellio/" rel="nofollow sponsored" class="cookie-modal__reject">Reject</a>
      </form>
    </div>
  </dialog>
</body>
</html>
