<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MetaBrew | Zum Angebot</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" href="/favicon.ico" sizes="64x64">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/assets/css/site.css">
  <script>
    window.cnl = {
      map: {
        "sub2": ["gclid"],
        "sub1": ["utm_source"],
        "sub3": ["utm_medium", "utm_campaign", "utm_content", "utm_term"]
      }
    };
  </script>
  <script src="https://cdn.jsdelivr.net/gh/opadim/assets/base.js"></script>
  <style>
    body.metabrew-page { --ink: #2b211b; --muted: #63594f; --brand: #6b4933; --accent: #805135; --accent-dark: #593522; min-height: 100vh; min-height: 100svh; background: #faf7f2; }
    .metabrew-backdrop { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
    .metabrew-backdrop picture, .metabrew-backdrop img { display: block; width: 100%; height: 100%; }
    .metabrew-backdrop img { object-fit: cover; object-position: center top; }
    .metabrew-page .country-modal { background: rgba(35, 24, 17, .65); }
    .metabrew-page .country-modal__dialog { max-width: 620px; }
  </style>
</head>
<body class="metabrew-page">
  <main class="metabrew-backdrop" inert aria-hidden="true">
    <picture>
      <source media="(max-width: 560px)" srcset="/assets/img/metabew-mobile.webp" type="image/webp">
      <source media="(max-width: 1024px)" srcset="/assets/img/metabew-tablet.webp" type="image/webp">
      <img src="/assets/img/metabew.webp" alt="" fetchpriority="high" decoding="async">
    </picture>
  </main>
  <dialog class="country-modal" open aria-modal="true" aria-labelledby="country-title" aria-describedby="country-description">
    <div class="country-modal__dialog">
      <p class="country-modal__eyebrow">MetaBrew Angebot</p>
      <h1 id="country-title">Wo möchten Sie das Angebot ansehen?</h1>
      <p id="country-description">Wählen Sie Ihren Standort, um zur Angebotsseite unseres Partners zu gelangen.</p>
      <form class="country-modal__options" action="/go/" method="post">
        <button class="country-modal__option" type="submit" name="country" value="de">
          <img src="/assets/img/flag-de.svg" alt="" width="96" height="60">
          <span>Deutschland</span>
        </button>
        <button class="country-modal__option" type="submit" name="country" value="us">
          <img src="/assets/img/flag-us.svg" alt="" width="96" height="60">
          <span>USA</span>
        </button>
        <button class="country-modal__option" type="submit" name="country" value="uk">
          <img src="/assets/img/flag-uk.svg" alt="" width="96" height="60">
          <span>London (Großbritannien)</span>
        </button>
      </form>
      <p class="country-modal__links"><a href="/datenschutz/">Datenschutz</a> · <a href="/affiliate-hinweis/">Affiliate-Hinweis</a></p>
    </div>
  </dialog>
  <script>
    document.querySelector('.country-modal__options').addEventListener('submit', function () {
      this.querySelectorAll('[data-tracking]').forEach(function (input) { input.remove(); });
      var allowed = ['gclid', 'gbraid', 'wbraid', 'msclkid', 'utm_source', 'utm_medium', 'utm_campaign', 'utm_content', 'utm_term'];
      var params = new URLSearchParams(window.location.search);
      var form = this;
      allowed.forEach(function (key) {
        var value = params.get(key);
        if (!value) return;
        var input = document.createElement('input');
        input.type = 'hidden';
        input.name = key;
        input.value = value;
        input.setAttribute('data-tracking', '');
        form.appendChild(input);
      });
    });
  </script>
</body>
</html>
