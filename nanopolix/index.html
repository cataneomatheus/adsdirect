<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NanoPolix | Till erbjudandet</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" href="/favicon.ico" sizes="64x64">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/assets/css/site.css?v=country-popup-nanopolix-1">
  <script>
    window.cnl = {
      map: {
        "sub2": ["gclid"],
        "sub1": ["utm_source"],
        "sub3": ["utm_medium", "utm_campaign", "utm_content", "utm_term"]
      }
    };
  </script>
  <script src="https://cdn.jsdelivr.net/gh/opadim/assets/base.js"></script>
  <style>
    .nanopolix-page, .nanopolix-page * { box-sizing: border-box; }
    body.nanopolix-page { --ink: #102a36; --muted: #52646d; --brand: #164f69; --accent: #187ba3; --accent-dark: #105d7d; min-height: 100vh; min-height: 100svh; margin: 0; background: #eaf2f5; color: var(--ink); font: 16px/1.5 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .nanopolix-backdrop { position: fixed; inset: 0; pointer-events: none; overflow: hidden; background: linear-gradient(135deg, #f7fafb 0%, #dce9ee 55%, #b7ced8 100%); }
    .nanopolix-backdrop picture, .nanopolix-backdrop img { display: block; width: 100%; height: 100%; }
    .nanopolix-backdrop img { object-fit: cover; object-position: center top; }
    .nanopolix-page .country-modal { position: fixed; inset: 0; z-index: 1000; width: 100%; max-width: none; height: 100%; max-height: none; margin: 0; padding: 1rem; border: 0; background: rgba(7, 32, 43, .74); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); }
    .nanopolix-page .country-modal[open] { display: grid; place-items: center; }
    .nanopolix-page .country-modal__dialog { width: min(100%, 620px); max-width: 620px; max-height: calc(100vh - 2rem); overflow-y: auto; padding: clamp(1.5rem, 5vw, 2.4rem); border: 1px solid #d8e6ec; border-radius: 22px; background: #f8fcfe; color: var(--ink); text-align: center; box-shadow: 0 28px 80px rgba(0,0,0,.46); }
    .nanopolix-page .country-modal__eyebrow { margin: 0 0 .45rem; color: var(--accent-dark); font-size: .75rem; font-weight: 850; letter-spacing: .13em; text-transform: uppercase; }
    .nanopolix-page .country-modal__dialog h1 { margin: 0 0 .8rem; color: var(--ink); font-size: clamp(1.8rem, 4vw, 2.45rem); line-height: 1.14; letter-spacing: -.03em; }
    .nanopolix-page .country-modal__dialog > p:not(.country-modal__eyebrow) { max-width: 470px; margin: 0 auto 1.3rem; color: var(--muted); font-size: 1rem; }
    .nanopolix-page .country-modal__options { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: .75rem; }
    .nanopolix-page .country-modal__option { display: flex; min-width: 0; min-height: 154px; flex-direction: column; align-items: center; justify-content: center; gap: .7rem; padding: 1rem .65rem; border: 2px solid #cbdfe8; border-radius: 14px; background: #fff; color: var(--ink); font: inherit; font-weight: 800; line-height: 1.25; cursor: pointer; transition: transform .15s ease, border-color .15s ease, box-shadow .15s ease; }
    .nanopolix-page .country-modal__option img { display: block; width: 96px; height: 60px; max-width: 100%; object-fit: contain; background: #fff; border: 1px solid rgba(0,0,0,.15); border-radius: 4px; box-shadow: 0 4px 10px rgba(0,0,0,.12); }
    .nanopolix-page .country-modal__option:hover { transform: translateY(-2px); border-color: var(--accent); box-shadow: 0 8px 20px rgba(16,93,125,.14); }
    .nanopolix-page .country-modal__option:focus-visible { outline: 3px solid var(--accent-dark); outline-offset: 3px; }
    .nanopolix-page .country-modal__option:disabled { opacity: .6; cursor: wait; transform: none; }
    .nanopolix-page .country-modal__status { display: inline-block; margin: 1rem auto 0 !important; padding: .45rem .85rem; border-radius: 999px; background: #e3f1f6; color: var(--accent-dark) !important; font-size: .9rem !important; font-weight: 800; }
    .nanopolix-page .country-modal__status[hidden] { display: none; }
    @media (max-width: 560px) {
      .nanopolix-page .country-modal { padding: .65rem; }
      .nanopolix-page .country-modal__dialog { max-height: calc(100vh - 1.3rem); padding: 1.4rem 1rem 1.2rem; border-radius: 17px; }
      .nanopolix-page .country-modal__options { grid-template-columns: 1fr; gap: .55rem; }
      .nanopolix-page .country-modal__option { min-height: 80px; flex-direction: row; justify-content: flex-start; padding: .55rem .8rem; text-align: left; }
      .nanopolix-page .country-modal__option img { width: 72px; height: 45px; flex: none; }
    }
  </style>
</head>
<body class="nanopolix-page">
  <main class="nanopolix-backdrop" inert aria-hidden="true">
    <picture>
      <source media="(max-width: 560px)" srcset="/assets/img/nanopolix-mobile.webp" type="image/webp">
      <source media="(max-width: 1024px)" srcset="/assets/img/nanopolix-tablet.webp" type="image/webp">
      <img src="/assets/img/nanopolix.webp" alt="" fetchpriority="high" decoding="async">
    </picture>
  </main>
  <dialog class="country-modal" open aria-modal="true" aria-labelledby="country-title" aria-describedby="country-description">
    <div class="country-modal__dialog">
      <p class="country-modal__eyebrow">NanoPolix-erbjudande</p>
      <h1 id="country-title">Var vill du se erbjudandet?</h1>
      <p id="country-description">Välj din plats för att gå vidare till vår partners erbjudandesida.</p>
      <form class="country-modal__options" action="/go/" method="post">
        <button class="country-modal__option" type="submit" name="country" value="se">
          <img src="/assets/img/flag-se.svg" alt="" width="96" height="60">
          <span>Sverige</span>
        </button>
        <button class="country-modal__option" type="submit" name="country" value="es">
          <img src="/assets/img/flag-es.svg" alt="" width="96" height="60">
          <span>Spanien</span>
        </button>
        <button class="country-modal__option" type="submit" name="country" value="us">
          <img src="/assets/img/flag-us.svg" alt="" width="96" height="60">
          <span>USA</span>
        </button>
      </form>
      <p class="country-modal__status" role="status" aria-live="polite" hidden>Omdirigerar...</p>
    </div>
  </dialog>
  <script>
    document.querySelector('.country-modal__options').addEventListener('submit', function (event) {
      event.preventDefault();
      if (this.dataset.submitting === 'true') return;
      this.dataset.submitting = 'true';
      var submitter = event.submitter && event.submitter.name === 'country'
        ? event.submitter
        : this.querySelector('button[name="country"]');
      this.querySelectorAll('[data-tracking]').forEach(function (input) { input.remove(); });
      var allowed = ['gclid', 'gbraid', 'wbraid', 'msclkid', 'utm_source', 'utm_medium', 'utm_campaign', 'utm_content', 'utm_term'];
      var params = new URLSearchParams(window.location.search);
      var form = this;
      allowed.forEach(function (key) {
        var value = params.get(key);
        if (!value) return;
        var input = document.createElement('input');
        input.type = 'hidden';
        input.name = key;
        input.value = value;
        input.setAttribute('data-tracking', '');
        form.appendChild(input);
      });
      var countryInput = document.createElement('input');
      countryInput.type = 'hidden';
      countryInput.name = 'country';
      countryInput.value = submitter.value;
      form.appendChild(countryInput);
      form.querySelectorAll('button[type="submit"]').forEach(function (button) { button.disabled = true; });
      form.setAttribute('aria-busy', 'true');
      document.querySelector('.country-modal__status').hidden = false;
      window.setTimeout(function () { HTMLFormElement.prototype.submit.call(form); }, 400);
    });
  </script>
</body>
</html>
