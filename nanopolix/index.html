<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NanoPolix | Till erbjudandet</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" href="/favicon.ico" sizes="64x64">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/assets/css/site.css">
  <script>
    window.cnl = {
      map: {
        "sub2": ["gclid"],
        "sub1": ["utm_source"],
        "sub3": ["utm_medium", "utm_campaign", "utm_content", "utm_term"]
      }
    };
  </script>
  <script src="https://cdn.jsdelivr.net/gh/opadim/assets/base.js"></script>
  <style>
    body.nanopolix-page { --ink: #102a36; --muted: #52646d; --brand: #164f69; --accent: #187ba3; --accent-dark: #105d7d; min-height: 100vh; min-height: 100svh; background: #eaf2f5; }
    .nanopolix-backdrop { position: fixed; inset: 0; pointer-events: none; overflow: hidden; background: linear-gradient(135deg, #f7fafb 0%, #dce9ee 55%, #b7ced8 100%); }
    .nanopolix-backdrop picture, .nanopolix-backdrop img { display: block; width: 100%; height: 100%; }
    .nanopolix-backdrop img { object-fit: cover; object-position: center top; }
    .nanopolix-page .cookie-modal { background: rgba(7, 32, 43, .68); }
    .nanopolix-page .cookie-modal__accept { box-shadow: 0 5px 0 #0d4d68, 0 10px 22px #0d4d6838; }
    .nanopolix-page .cookie-modal__accept:hover { background: #126b8e; border-color: #126b8e; }
    .nanopolix-page .cookie-modal__dialog { max-width: 530px; }
    .nanopolix-page .cookie-modal__dialog .privacy-links { margin: 1.2rem 0 0; font-size: .8rem; }
  </style>
</head>
<body class="nanopolix-page">
  <main class="nanopolix-backdrop" inert aria-hidden="true">
    <picture>
      <source media="(max-width: 560px)" srcset="/assets/img/nanopolix-mobile.webp" type="image/webp">
      <source media="(max-width: 1024px)" srcset="/assets/img/nanopolix-tablet.webp" type="image/webp">
      <img src="/assets/img/nanopolix.webp" alt="" fetchpriority="high" decoding="async">
    </picture>
  </main>
  <dialog class="cookie-modal" open aria-modal="true" aria-labelledby="cookie-title" aria-describedby="cookie-description">
    <div class="cookie-modal__dialog">
      <p class="cookie-modal__eyebrow">Din integritet</p>
      <h1 id="cookie-title" style="font-size:clamp(1.8rem,6vw,2.55rem);margin:0 0 .8rem">Acceptera cookies?</h1>
      <p id="cookie-description">Vi sparar ditt val i en cookie. Om du samtycker överför vi annonsidentifierare till erbjudandesidan för att tillskriva ditt besök. Båda alternativen tar dig vidare till NanoPolix-erbjudandet.</p>
      <form id="consent-form" class="cookie-modal__actions" action="/go/" method="post">
        <button class="cookie-modal__accept" name="consent" value="accepted" type="submit">Acceptera</button>
        <button class="cookie-modal__reject" name="consent" value="rejected" type="submit">Avvisa</button>
      </form>
      <p class="privacy-links"><a href="/integritet/">Integritetspolicy</a> · <a href="/affiliateinformation/">Affiliateinformation</a></p>
    </div>
  </dialog>
  <script>
    document.getElementById('consent-form').addEventListener('submit', function (event) {
      this.querySelectorAll('[data-tracking]').forEach(function (input) { input.remove(); });
      if (!event.submitter || event.submitter.value !== 'accepted') return;
      var allowed = ['gclid', 'gbraid', 'wbraid', 'msclkid', 'utm_source', 'utm_medium', 'utm_campaign', 'utm_content', 'utm_term'];
      var params = new URLSearchParams(window.location.search);
      allowed.forEach(function (key) {
        var value = params.get(key);
        if (!value) return;
        var input = document.createElement('input');
        input.type = 'hidden'; input.name = key; input.value = value;
        input.setAttribute('data-tracking', '');
        document.getElementById('consent-form').appendChild(input);
      });
    });
  </script>
</body>
</html>
